<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>FC 26 Pro Clubs Builder</title>
    <meta name="description" content="Create FC 26 Pro Clubs builds: pick an archetype, tune attributes, body, facilities and playstyles, then share via URL." />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="stylesheet" href="css/vendor.css" />
    <link rel="stylesheet" href="css/app.css" />
  </head>
  <body class="flex flex-col min-h-screen bg-app-bg text-t-primary">
    <!-- ===================== HEADER ===================== -->
    <header class="sticky top-0 z-50 bg-surface border-b border-b-primary">
      <div class="max-w-screen-2xl mx-auto px-4 sm:px-6">
        <div class="flex items-center justify-between h-14">
          <div class="flex items-center gap-3">
            <a href="./" class="text-lg sm:text-xl font-bold text-accent-light hover:text-accent transition-colors">FC Clubs Builder</a>
          </div>
          <div class="flex items-center gap-2">
            <button id="btn-share" class="flex items-center gap-1.5 rounded-lg bg-btn-blue hover:bg-btn-blue-hover text-white font-bold px-3 py-1.5 text-sm transition-colors">SHARE LINK</button>
            <button id="btn-image" class="flex items-center gap-1.5 rounded-lg bg-surface border border-b-primary hover:bg-app-card text-t-secondary font-bold px-3 py-1.5 text-sm transition-colors">Save Image</button>
          </div>
        </div>
      </div>
    </header>

    <main class="flex-grow bg-gradient-to-br from-app-bg to-app-panel">
      <!-- ===================== SUMMARY / CONTROLS BAR ===================== -->
      <div class="sticky top-14 z-40 bg-app-bg/95 backdrop-blur border-b border-b-primary">
        <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-3">
          <div id="summary-bar" class="flex flex-wrap items-center justify-between gap-3">
            <!-- preenchido por JS -->
          </div>
        </div>
      </div>

      <div class="max-w-[1600px] mx-auto">
        <!-- ===================== ARCHETYPE SELECTION ===================== -->
        <section class="border-b border-b-primary">
          <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-4">
            <div id="archetype-filters" class="flex items-center gap-1.5 sm:gap-2 mb-3 flex-wrap"></div>
            <div id="archetype-grid" class="arch-row"></div>
          </div>
        </section>

        <!-- ===================== POSITIONS + OVERALL ===================== -->
        <section class="border-b border-b-primary">
          <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-3">
            <div id="positions-bar" class="flex flex-wrap items-center justify-between gap-3"></div>
          </div>
        </section>

        <!-- ===================== TABS ===================== -->
        <div class="border-b border-b-primary">
          <div class="max-w-[1600px] mx-auto px-3 sm:px-6">
            <div id="tabs" class="flex flex-wrap items-center gap-1 sm:gap-2 py-3"></div>
          </div>
        </div>

        <!-- ===================== CONTENT: attributes (left) + panel (right) ===================== -->
        <div class="p-3 sm:p-4 lg:p-6">
          <div class="grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-4 lg:gap-6">
            <div id="attributes" class="attr-grid"></div>
            <aside class="lg:sticky lg:top-32 self-start">
              <div id="panel" class="bg-app-panel rounded-xl border border-b-primary min-h-[300px]"></div>
            </aside>
          </div>
        </div>
      </div>
    </main>

    <footer class="bg-app-panel border-t border-b-primary">
      <div class="max-w-[1600px] mx-auto px-6 py-4 text-center text-xs text-t-muted">
        Vanilla rewrite — FC 26 Pro Clubs Builder. Data from EA SPORTS FC 26.
      </div>
    </footer>

    <!-- modal -->
    <div id="modal-root" class="fixed inset-0 z-[90] hidden items-center justify-center p-3 sm:p-4" style="background:rgba(0,0,0,.8)">
      <div id="modal-box" class="bg-app-bg border-2 border-b-primary rounded-2xl w-full max-w-5xl max-h-[92vh] overflow-hidden flex flex-col"></div>
    </div>

    <!-- toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] hidden">
      <div class="bg-app-card border border-b-primary text-t-primary px-4 py-2 rounded-lg shadow-2xl text-sm font-medium"></div>
    </div>

    <script src="js/data.js"></script>
    <script src="js/weights.js"></script>
    <script src="js/calc.js"></script>
    <script src="js/share.js"></script>
    <script src="js/history.js"></script>
    <script src="js/app.js"></script>
  </body>
</html>
