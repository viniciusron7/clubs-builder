<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=5" />
    <title>FC 26 Pro Clubs Builder</title>
    <meta name="description" content="Create FC 26 Pro Clubs builds: tune attributes, Club Facilities, body and PlayStyles, then share via URL." />
    <meta name="theme-color" content="#07131d" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="favicon.ico" sizes="any" />
    <link rel="manifest" href="site.webmanifest" />
    <link rel="stylesheet" href="css/vendor.css" />
    <link rel="stylesheet" href="css/app.css?v=20260730-screenshot-ap" />
  </head>
  <body class="flex flex-col min-h-screen bg-app-bg text-t-primary">
    <a class="skip-link" href="#main-content">Skip to content</a>

    <main id="main-content" tabindex="-1" class="app-main flex-grow bg-gradient-to-br from-app-bg to-app-panel">
      <section id="community-home" class="community-home" aria-label="Community Builds">
        <div class="community-home-loading" aria-label="Loading Community Builds">
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <div id="builder-app" hidden>
        <!-- ===================== SUMMARY / CONTROLS BAR ===================== -->
        <div class="build-toolbar bg-app-bg/95 border-b border-b-primary">
          <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-3">
            <div id="summary-bar" class="summary-layout">
              <!-- populated by JavaScript -->
            </div>
          </div>
        </div>

        <div class="max-w-[1600px] mx-auto">
          <!-- ===================== ARCHETYPE SELECTION ===================== -->
          <section class="builder-section archetype-section border-b border-b-primary">
            <div class="builder-section-inner max-w-[1600px] mx-auto px-3 sm:px-6 py-4">
              <div id="archetype-filters" class="flex items-center gap-1.5 sm:gap-2 mb-3 flex-wrap"></div>
              <div id="archetype-grid" class="arch-row"></div>
            </div>
          </section>

          <!-- ===================== POSITIONS + OVERALL ===================== -->
          <section class="builder-section positions-section border-b border-b-primary">
            <div class="max-w-[1600px] mx-auto px-3 sm:px-6 py-3">
              <div id="positions-bar" class="flex flex-wrap items-center justify-between gap-3"></div>
            </div>
          </section>

          <!-- ===================== TABS ===================== -->
          <div class="builder-tools border-b border-b-primary">
            <div class="max-w-[1600px] mx-auto px-3 sm:px-6">
              <div id="tabs" class="flex flex-wrap items-center gap-1 sm:gap-2 py-3"></div>
            </div>
          </div>

          <!-- ===================== CONTENT: attributes (left) + panel (right) ===================== -->
          <div class="attribute-workspace p-3 sm:p-4 lg:p-6">
            <div class="attribute-stage grid grid-cols-1 lg:grid-cols-[1fr_400px] gap-4 lg:gap-6">
              <div id="attributes" class="attr-grid"></div>
              <aside class="detail-aside lg:sticky lg:top-32 self-start">
                <div id="panel" class="detail-panel bg-app-panel rounded-xl border border-b-primary min-h-[300px]"></div>
              </aside>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer class="app-footer bg-app-panel border-t border-b-primary">
      <div class="max-w-[1600px] mx-auto px-6 py-4 text-center text-xs text-t-muted">
        FC 26 Pro Clubs Builder · Independent build planning tool.
      </div>
    </footer>

    <!-- modal -->
    <div id="modal-root" class="fixed inset-0 z-[90] hidden items-center justify-center p-3 sm:p-4" style="background:rgba(0,0,0,.8)">
      <div id="modal-box" role="dialog" aria-modal="true" aria-labelledby="modal-title" tabindex="-1"
        class="bg-app-bg border-2 border-b-primary rounded-2xl w-full max-w-5xl max-h-[92vh] overflow-hidden flex flex-col"></div>
    </div>

    <!-- toast -->
    <div id="toast" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-[100] hidden">
      <div role="status" aria-live="polite" class="bg-app-card border border-b-primary text-t-primary px-4 py-2 rounded-lg shadow-2xl text-sm font-medium"></div>
    </div>

    <script src="js/data.js?v=20260730-ingame-stats"></script>
    <script src="js/weights.js"></script>
    <script src="js/calc.js?v=20260730-screenshot-ap"></script>
    <script src="js/share.js?v=20260730-ingame-stats"></script>
    <script src="js/community-config.js"></script>
    <script src="js/community.js?v=20260729-community-home"></script>
    <script src="js/build-card.js?v=20260729-card-layout-2"></script>
    <script src="js/history.js"></script>
    <script src="js/screenshot-import.js?v=20260730-screenshot-import"></script>
    <script src="js/app.js?v=20260730-screenshot-ap"></script>
  </body>
</html>
